<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoalProb diagnostics</title>
<style>
  :root{--bg:#0b0f14;--bg2:#121820;--bg3:#1a222d;--line:#232d3a;--fg:#e8eef5;
        --mut:#8b9bb0;--dim:#5d6b7e;--acc:#2dd4a7;--bad:#f4525f;--warn:#f5a524}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:16px 12px 40px;
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  h1 span{color:var(--acc)}
  p.sub{color:var(--dim);font-size:12px;margin:0 0 16px}
  button{width:100%;background:var(--acc);color:#04231b;border:0;border-radius:8px;
         padding:12px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:10px}
  button:disabled{opacity:.45}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .slow{color:var(--bad);font-weight:700}
  .mid{color:var(--warn)}
  .ok{color:var(--acc)}
  pre{background:#060a0e;border:1px solid var(--line);border-radius:8px;padding:11px;
      font-size:11px;line-height:1.5;overflow:auto;white-space:pre-wrap;word-break:break-word;
      color:var(--mut);margin:12px 0 0}
  .note{font-size:12px;color:var(--dim);line-height:1.6;background:var(--bg2);
        border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:12px}
</style>
</head>
<body><div class="wrap">

<h1>Goal<span>Prob</span> diagnostics</h1>
<p class="sub">Times each read the app makes and reports how big it was, so the slow step can be identified rather than guessed at.</p>

<button id="go">Run diagnostics</button>

<div id="out"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, doc, getDoc, collection, query, where, getDocs }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyCXQa90edRos4BzoK4md2OYeq_ogYoesjQ",
  authDomain:        "zxtvfb-bb48a.firebaseapp.com",
  projectId:         "zxtvfb-bb48a",
  storageBucket:     "zxtvfb-bb48a.firebasestorage.app",
  messagingSenderId: "982389556203",
  appId:             "1:982389556203:web:6013bd601a9d7cf19f0fae"
};
const db = getFirestore(initializeApp(firebaseConfig));

const todayISO = (d = new Date()) =>
  new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const kb  = n => (n/1024).toFixed(1) + ' KB';
const cls = ms => ms > 3000 ? 'slow' : ms > 800 ? 'mid' : 'ok';
const size = o => { try { return JSON.stringify(o).length; } catch { return 0; } };

const rows = [];
function add(step, ms, bytes, detail){
  rows.push({ step, ms: Math.round(ms), bytes, detail });
  render();
}
function render(){
  document.getElementById('out').innerHTML = `
    <table>
      <tr><th>step</th><th class="n">time</th><th class="n">size</th><th>detail</th></tr>
      ${rows.map(r => `<tr>
        <td>${r.step}</td>
        <td class="n ${cls(r.ms)}">${r.ms} ms</td>
        <td class="n">${r.bytes ? kb(r.bytes) : '—'}</td>
        <td style="color:var(--dim)">${r.detail || ''}</td>
      </tr>`).join('')}
    </table>`;
}

async function timed(step, fn, detail){
  const t = performance.now();
  let result = null, bytes = 0, note = detail || '';
  try {
    const r = await fn();
    result = r && r.value !== undefined ? r.value : r;
    bytes = r && r.bytes !== undefined ? r.bytes : size(result);
    if (r && r.note) note = r.note;
  } catch (e) {
    note = 'FAILED: ' + e.message;
  }
  add(step, performance.now() - t, bytes, note);
  return result;
}

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  rows.length = 0; render();

  const date = todayISO();

  /* 1. connection + first read */
  await timed('connect + first read', async () => {
    const d = await getDoc(doc(db, 'meta', 'sync'));
    return { value: d.exists() ? d.data() : null, note: 'meta/sync' };
  });

  /* 2. the day's fixtures */
  const fx = await timed("today's fixtures", async () => {
    const snap = await getDocs(query(collection(db,'fixtures'), where('date','==',date)));
    let bytes = 0, chunks = 0, rowsOut = [];
    snap.forEach(d => {
      chunks++;
      const v = d.data();
      bytes += size(v);
      const parsed = typeof v.f === 'string' ? JSON.parse(v.f) : (v.f || []);
      rowsOut.push(...parsed);
    });
    return { value: rowsOut, bytes, note: `${chunks} chunk(s), ${rowsOut.length} fixtures` };
  });

  if (!fx || !fx.length) {
    add('stop', 0, 0, 'no fixtures stored for ' + date + ' — try another date in the app');
    btn.disabled = false; return;
  }

  const leagues = [...new Set(fx.map(f => f.lid).filter(Boolean))];
  const withKey = fx.filter(f => f.k).length;
  add('fixture summary', 0, 0,
      `${leagues.length} leagues · ${withKey}/${fx.length} carry an odds key`);

  /* 3. one league bundle */
  const lid = leagues[0];
  const bundle = await timed('one league bundle', async () => {
    const d = await getDoc(doc(db, 'cache', 'league_' + lid));
    if (!d.exists()) return { value: null, bytes: 0, note: `cache/league_${lid} MISSING` };
    const v = d.data();
    const teams = typeof v.teams === 'string' ? JSON.parse(v.teams) : (v.teams || {});
    return { value: { ...v, teams }, bytes: size(v),
             note: `league ${lid}, ${Object.keys(teams).length} teams in bundle` };
  });

  /* 4. how many of today's leagues actually have a bundle */
  await timed('bundle coverage', async () => {
    const check = leagues.slice(0, 10);
    let have = 0;
    for (const l of check) {
      const d = await getDoc(doc(db, 'cache', 'league_' + l));
      if (d.exists()) have++;
    }
    return { value: null, bytes: 0,
             note: `${have}/${check.length} sampled leagues have a bundle` };
  });

  /* 5. one team document — the heavy one */
  const sample = fx.find(f => f.hid);
  await timed('one team document', async () => {
    const d = await getDoc(doc(db, 'teams', String(sample.hid)));
    if (!d.exists()) return { value:null, bytes:0, note:`teams/${sample.hid} MISSING` };
    const v = d.data();
    const m = typeof v.m === 'string' ? JSON.parse(v.m) : (v.m || []);
    return { value:v, bytes:size(v),
             note:`${sample.hname} — ${m.length} matches stored` };
  });

  /* 6. the day's odds */
  await timed("today's odds", async () => {
    const d = await getDoc(doc(db, 'odds', date));
    if (!d.exists()) return { value:null, bytes:0, note:'no odds document for today' };
    const v = d.data();
    const o = typeof v.o === 'string' ? JSON.parse(v.o) : (v.o || {});
    return { value:o, bytes:size(v), note:`${Object.keys(o).length} matches priced` };
  });

  /* 7. what a single row costs when the bundle misses */
  await timed('price one fixture', async () => {
    const f = fx.find(x => x.hid && x.aid) || fx[0];
    const inBundle = bundle && bundle.teams && bundle.teams[f.hid];
    if (inBundle) return { value:null, bytes:0, note:'served from the bundle, no extra read' };
    const [a,b] = await Promise.all([
      getDoc(doc(db,'teams',String(f.hid))),
      getDoc(doc(db,'teams',String(f.aid)))
    ]);
    const bytes = (a.exists()?size(a.data()):0) + (b.exists()?size(b.data()):0);
    return { value:null, bytes, note:'bundle missed — two full team documents' };
  });

  const total = rows.reduce((a,r)=>a+r.ms,0);
  const bytes = rows.reduce((a,r)=>a+r.bytes,0);
  add('TOTAL', total, bytes, '');

  document.getElementById('out').insertAdjacentHTML('beforeend',
    `<div class="note">Send this table back. The row with the red time is where the delay
     actually is — everything else is noise.</div>`);

  btn.disabled = false;
};
</script>
</div></body></html>
