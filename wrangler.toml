# This MUST match the Worker name in the Cloudflare dashboard. If it does
# not, a deploy targets a different Worker than the one holding your
# secrets, and every run reports the secrets as missing.
name = "goalprob-cf"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

# Serves index.html. Requests to static assets are free and do not
# count against the 100,000 daily request limit on the free plan.
[assets]
directory = "./public"
binding = "ASSETS"

# Cron triggers. A Worker receives every cron through one scheduled()
# handler, so src/index.mjs picks the job by the minute it fires on:
#   :00  pull    fetch fixtures          up to 3 API-Football calls
#   :20  digest  build team records      no API calls
#   :40  odds    bookmaker prices        ~15 Odds API credits
#
# The free plan allows 5 cron triggers per account.
[triggers]
crons = ["0 * * * *", "20 * * * *", "40 6 * * *"]

# Plain variables live here, and ONLY here.
#
# A deploy replaces the Worker's plaintext variables with whatever this
# file lists. Anything added in the dashboard as type "Text" and not
# repeated here is wiped on the next deploy — which is why the secrets
# kept disappearing. The project id is not sensitive (it already appears
# in index.html), so it is safe to keep in git and is pinned here.
[vars]
FIREBASE_PROJECT_ID = "zxtvfb-bb48a"

# The remaining four must be added in the dashboard with type SECRET,
# not Text. Secrets are stored separately and survive every deploy:
#
#   FIREBASE_CLIENT_EMAIL
#   FIREBASE_PRIVATE_KEY
#   APIFOOTBALL_KEY
#   ODDS_API_KEY      (optional — odds and Flip x2 need it)
#   ADMIN_KEY         (optional — closes the /jobs/ URLs)
#
# Dashboard → Settings → Variables and Secrets → Add → Type: Secret.

[observability]
enabled = true
